name: Deploy Graph mail pipeline to Test (service principal)

on:
  workflow_dispatch:
    inputs:
      pipeline_name:
        description: "Pipeline to deploy from fabric1"
        required: true
        default: "Palani_Pipeline_2_Graph"

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: fabric-test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fabric-cicd
        run: python -m pip install fabric-cicd==1.4.0 azure-identity

      - name: Sign in as the service principal
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Deploy only the Graph mail pipeline to the Test workspace
        env:
          FABRIC_WORKSPACE_ID: ${{ vars.FABRIC_WORKSPACE_ID }}
          PIPELINE_NAME: ${{ inputs.pipeline_name }}
        run: python scripts/deploy_pipeline_graph.py
