name: Deploy Fabric workspace

on:
  push:
    branches: [main]
    paths:
      - "fabric1/**"
      - "scripts/deploy_fabric.py"
      - ".github/workflows/deploy-fabric.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: fabric-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: fabric-dev

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deployment dependencies
        run: python -m pip install fabric-cicd==1.4.0 azure-identity

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Deploy Fabric items
        env:
          FABRIC_WORKSPACE_ID: ${{ vars.FABRIC_WORKSPACE_ID }}
        run: python scripts/deploy_fabric.py
